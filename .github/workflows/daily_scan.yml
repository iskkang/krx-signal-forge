name: Daily KRX Scan

on:
  schedule:
    # 16:10 KST = 07:10 UTC (평일)
    - cron: "10 7 * * 1-5"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15        # 15분 초과 시 GitHub가 강제 종료

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore state cache
        uses: actions/cache@v4
        with:
          path: state
          key: krx-state-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            krx-state-${{ github.ref }}-

      - name: Update universe (weekly on Monday)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.event.schedule, '10 7 * * 1')
        run: |
          python scripts/update_universe.py
        timeout-minutes: 8

      - name: Run scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m src.runner
        timeout-minutes: 10

      - name: Upload state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-${{ github.run_id }}
          path: state
          retention-days: 7
