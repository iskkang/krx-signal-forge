name: Daily KRX Scan

on:
  schedule:
    # 16:10 KST = 07:10 UTC (weekdays)
    - cron: "10 7 * * 1-5"
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore state cache
        uses: actions/cache@v4
        with:
          path: state
          key: krx-signal-forge-state-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            krx-signal-forge-state-${{ github.ref }}-

      - name: Weekly universe update (Mon)
        if: ${{ github.event_name == 'schedule' && contains('1', format('{0}', github.event.schedule)) }}
        run: |
          python scripts/update_universe.py

      - name: Ensure universe exists
        run: |
          test -f config/universe.txt || python scripts/update_universe.py

      - name: Run scan
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python -m src.runner

      - name: Upload state artifact
        uses: actions/upload-artifact@v4
        with:
          name: state
          path: state
