name: Update KRX Universe

on:
  workflow_dispatch:
  schedule:
    # KST 07:10 = UTC 22:10 (previous day)
    - cron: "10 22 * * 1-5"

jobs:
  update-universe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update universe
        run: |
          python scripts/update_universe.py

      - name: Commit updated universe (if changed)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add config/universe.txt state/universe_backup || true
          git commit -m "Update KRX universe" || echo "No changes to commit"
          git push || true
